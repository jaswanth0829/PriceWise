<!DOCTYPE html>
<html>

<head>

    <title>Login - PriceWise</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <div class="form-card">

            <h1>

                Login

            </h1>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">

                    Login

                </button>

            </form>

            <br>

            <a href="/register">

                Create Account

            </a>

        </div>

    </div>

</body>

</html>
