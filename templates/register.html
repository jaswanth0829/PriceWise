<!DOCTYPE html>
<html>

<head>

    <title>Register - PriceWise</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <div class="form-card">

            <h1>

                Register

            </h1>

            <form method="POST">

                <input
                    type="text"
                    name="username"
                    placeholder="Username"
                    required
                >
                <input
                   type="email"
                   name="email"
                   placeholder="Email"
                   required
                >
                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">

                    Register

                </button>

            </form>

            <br>

            <a href="/login">

                Already have account?

            </a>

        </div>

    </div>

</body>

</html>
